name: Release

# Triggered by pushing a tag like v0.1.0. Runs the full test suite again
# (never release on an untested build), packages Ration.app, wraps it in a
# .dmg, and publishes both as a GitHub Release.
#
# Note: the .dmg is only ad-hoc signed (see Scripts/build_app.sh). Without a
# paid Apple Developer account for real signing + notarization, first
# launch on another Mac will show an "unidentified developer" Gatekeeper
# prompt — right-click > Open gets past it. That's a deliberate trade to
# keep this pipeline entirely on GitHub's free tier.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: swift test

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build Ration.app
        env:
          RATION_VERSION: ${{ steps.version.outputs.version }}
        run: ./Scripts/build_app.sh

      - name: Smoke test
        run: ./Scripts/smoke_test.sh

      - name: Build .dmg
        env:
          RATION_VERSION: ${{ steps.version.outputs.version }}
        run: ./Scripts/make_dmg.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Ration.dmg
          generate_release_notes: true

      # Keeps solodynamo/homebrew-ration's Casks/ration.rb in sync so
      # `brew upgrade ration` picks up every release automatically. No-ops
      # until HOMEBREW_TAP_TOKEN exists: a fine-grained PAT scoped only to
      # the homebrew-ration repo (Contents: Read and write), added via
      # `gh secret set HOMEBREW_TAP_TOKEN --repo solodynamo/Ration`.
      # Deliberately not the GITHUB_TOKEN this workflow already has — that
      # one can't write to a different repo, and a broader personal token
      # has no business sitting in CI when a scoped one will do.
      - name: Bump Homebrew cask
        if: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHA=$(shasum -a 256 dist/Ration.dmg | awk '{print $1}')
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/solodynamo/homebrew-ration.git" tap
          cd tap
          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/ration.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA}\"/" Casks/ration.rb
          git config user.name "ration-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -am "Bump ration to ${VERSION}" || { echo "no changes"; exit 0; }
          git push
